// ── Shared Button Component ───────────────────────────────────
function Button({ children, onClick, disabled, variant = 'primary', className = '', title = '' }) {
  const base = "px-4 py-2 rounded-xl font-semibold transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed text-sm flex items-center justify-center gap-2";
  const variants = {
    primary: "bg-[#5E56E3] hover:bg-[#4F46E5] text-white shadow-sm",
    outline: "border border-[rgba(255,255,255,0.18)] hover:border-[#5E56E3] text-[#E2E8F0] hover:bg-[rgba(94,86,227,0.08)]",
    danger: "bg-[#EF4444] hover:bg-[#DC2626] text-white shadow-sm",
    ghost: "text-[#94A3B8] hover:text-[#E2E8F0] hover:bg-[rgba(255,255,255,0.05)]",
    success: "bg-[#05C493] hover:bg-[#04AC81] text-white font-bold shadow-sm"
  };
  return (
    <button onClick={onClick} disabled={disabled} className={`${base} ${variants[variant]} ${className}`} title={title}>
      {children}
    </button>
  );
}

// ── SVG Roadmap View ──────────────────────────────────────────
function RoadmapView({ trackId, completedCourses, backlogs, department, setSelectedCourse }) {
  const dept = (department || "ECE").toUpperCase();
  const tracks = window.getDepartmentCareerTracks(dept);
  const track = tracks[trackId];
  if (!track || !track.courseSequence) return null;
  const sequence = track.courseSequence;
  const deptCourses = window.getDepartmentCourses(dept);
  
  const nodeStatus = (code) => {
    const comp = completedCourses?.[code];
    if (comp && comp.grade && comp.grade !== "F" && comp.grade !== "Not Attempted") return "completed";
    if ((backlogs || []).includes(code)) return "backlog";
    const check = window.checkPrerequisites(code, completedCourses, backlogs, dept);
    if (check.eligible) return "eligible";
    return "locked";
  };

  const nodeColors = { completed: "#05C493", backlog: "#EF4444", eligible: "#EAB308", locked: "#64748B" };

  return (
    <div className="overflow-x-auto py-4 custom-scrollbar">
      <svg width={Math.max(800, sequence.length * 190)} height="160" viewBox={`0 0 ${sequence.length * 190} 160`}>
        <defs>
          <marker id="arrow-completed" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#05C493" /></marker>
          <marker id="arrow-locked" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#64748B" /></marker>
        </defs>
        {sequence.map((code, i) => {
          const course = deptCourses.find(c => c.code === code);
          const status = nodeStatus(code);
          const x = i * 190 + 80;
          const y = 80;
          return (
            <g key={code} onClick={() => course && setSelectedCourse(course)} style={{cursor:"pointer"}} className="transition-transform hover:-translate-y-1">
              {i < sequence.length - 1 && (
                <line x1={x + 40} y1={y} x2={x + 150} y2={y}
                  stroke={status === "completed" ? "#05C493" : "#64748B"}
                  strokeWidth="2.5" markerEnd={`url(#arrow-${status === 'completed' ? 'completed' : 'locked'})`} />
              )}
              <circle cx={x} cy={y} r={38} fill={nodeColors[status] + "22"} stroke={nodeColors[status]} strokeWidth="2.5" />
              <text x={x} y={y - 8} textAnchor="middle" fill={nodeColors[status]} fontSize="12" fontWeight="bold" className="code-font">{code}</text>
              <text x={x} y={y + 12} textAnchor="middle" fontSize="14">
                {status === "completed" ? "✅" : status === "backlog" ? "❌" : status === "eligible" ? "🟡" : "🔒"}
              </text>
              <text x={x} y={y + 60} textAnchor="middle" fill="#A0A0A0" fontSize="10">{course ? course.name.split(" ").slice(0, 3).join(" ") : code}</text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

// ── Curriculum Graph Component ─────────────────────────────────────
function CurriculumGraph({ profile, onClose, setSelectedCourse }) {
  const [nodes, setNodes] = useState([]);
  const [edges, setEdges] = useState([]);
  const [dims, setDims] = useState({ width: 2600, height: 1600 });
  const dept = profile?.department || "ECE";
  const deptCourses = window.getDepartmentCourses(dept);
  
  useEffect(() => {
    const depths = {};
    let changed = true;
    deptCourses.forEach(c => depths[c.code] = 0);
    
    let iterations = 0;
    while(changed && iterations < 20) {
      changed = false;
      iterations++;
      deptCourses.forEach(c => {
        if (!c.prerequisites || c.prerequisites.length === 0) return;
        const validPrereqDepths = c.prerequisites.map(p => depths[p] !== undefined ? depths[p] : 0);
        const maxPrereqDepth = Math.max(...validPrereqDepths);
        if (depths[c.code] !== maxPrereqDepth + 1) {
          depths[c.code] = maxPrereqDepth + 1;
          changed = true;
        }
      });
    }
    
    const columns = {};
    deptCourses.forEach(c => {
      const d = depths[c.code] || 0;
      if (!columns[d]) columns[d] = [];
      columns[d].push(c);
    });
    
    const gapX = 330;
    const gapY = 115;
    
    const newNodes = [];
    const newEdges = [];
    const nodePositions = {};
    
    const maxCoursesInCol = Math.max(...Object.values(columns).map(col => col.length), 1);
    const maxD = Math.max(...Object.keys(columns).map(Number), 0);
    const totalHeight = maxCoursesInCol * gapY;
    const calcWidth = Math.max(2600, (maxD + 1) * gapX + 260);
    const calcHeight = Math.max(1600, totalHeight + 240);
    setDims({ width: calcWidth, height: calcHeight });

    Object.keys(columns).forEach(depth => {
      const colCourses = columns[depth];
      const d = parseInt(depth);
      const colHeight = colCourses.length * gapY;
      const startY = (totalHeight - colHeight) / 2 + 100;
      
      colCourses.forEach((course, idx) => {
        const x = d * gapX + 80;
        const y = startY + (idx * gapY);
        nodePositions[course.code] = { x, y, course, depth: d };
        newNodes.push({ id: course.code, x, y, course, depth: d });
      });
    });
    
    deptCourses.forEach(course => {
      if (course.prerequisites) {
        course.prerequisites.forEach(pre => {
          if (nodePositions[pre] && nodePositions[course.code]) {
            newEdges.push({
              source: nodePositions[pre],
              target: nodePositions[course.code]
            });
          }
        });
      }
    });
    
    setNodes(newNodes);
    setEdges(newEdges);
  }, [profile.department]);
  
  return (
    <div className="modal-overlay z-50 flex items-center justify-center p-4">
      <div className="bg-[var(--bg-primary)] w-full h-full rounded-2xl border border-[var(--card-border)] flex flex-col relative overflow-hidden">
        <div className="flex flex-wrap justify-between items-center p-5 border-b border-[var(--card-border)] z-10 bg-[var(--bg-primary)] gap-3">
          <div>
            <h2 className="text-xl font-bold flex items-center gap-2 text-white">🕸️ Prerequisite Tree & Curriculum Graph ({dept})</h2>
            <p className="text-xs text-[#94A3B8] mt-0.5">Topological dependency progression across 48 courses (192 credits). Click any subject for complete details.</p>
          </div>
          
          <div className="flex items-center gap-3 text-xs">
            <span className="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-[rgba(5,196,147,0.1)] border border-[#05C493] text-[#05C493]">
              <span>✅</span> Passed
            </span>
            <span className="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-[rgba(239,68,68,0.1)] border border-[#EF4444] text-[#EF4444]">
              <span>❌</span> Backlog
            </span>
            <span className="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-[rgba(94,86,227,0.15)] border border-[#5E56E3] text-[#7E78EE]">
              <span>🟡</span> Eligible
            </span>
            <span className="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-[rgba(255,255,255,0.05)] border border-[rgba(255,255,255,0.1)] text-[#94A3B8]">
              <span>🔒</span> Locked
            </span>
            <button onClick={onClose} className="text-2xl text-[#94A3B8] hover:text-white p-2 leading-none">&times;</button>
          </div>
        </div>
        
        <div className="flex-1 overflow-auto relative p-8 custom-scrollbar">
          <svg className="absolute top-0 left-0" style={{width: `${dims.width}px`, height: `${dims.height}px`, pointerEvents: 'none'}}>
            {edges.map((edge, i) => {
              const sx = edge.source.x + 200;
              const sy = edge.source.y + 36;
              const tx = edge.target.x;
              const ty = edge.target.y + 36;
              return (
                <path key={i} d={`M ${sx} ${sy} C ${sx + 75} ${sy}, ${tx - 75} ${ty}, ${tx} ${ty}`} fill="none" stroke="rgba(94,86,227,0.35)" strokeWidth="2.5" />
              );
            })}
          </svg>
          
          <div className="relative" style={{width: `${dims.width}px`, height: `${dims.height}px`}}>
            {nodes.map(node => {
              const comp = profile.completedCourses?.[node.id];
              const isPassed = comp && comp.grade && comp.grade !== 'F' && comp.grade !== 'Not Attempted';
              const isBacklog = (profile.backlogs || []).includes(node.id) || comp?.grade === 'F';
              const prereqCheck = window.checkPrerequisites(node.id, profile.completedCourses, profile.backlogs, dept);
              const isEligible = !isPassed && !isBacklog && prereqCheck.eligible;
              const isLocked = !isPassed && !isBacklog && !prereqCheck.eligible;
              
              let cardStyle = "bg-[rgba(255,255,255,0.03)] border-[rgba(255,255,255,0.12)] text-[#94A3B8]";
              let icon = "🔒";
              if (isPassed) {
                cardStyle = "bg-[rgba(5,196,147,0.12)] border-[#05C493] text-white";
                icon = "✅";
              } else if (isBacklog) {
                cardStyle = "bg-[rgba(239,68,68,0.14)] border-[#EF4444] text-white";
                icon = "❌";
              } else if (isEligible) {
                cardStyle = "bg-[rgba(94,86,227,0.16)] border-[#5E56E3] text-white";
                icon = "🟡";
              }

              return (
                <div key={node.id} 
                  className={`absolute w-[200px] p-3.5 rounded-xl border backdrop-blur-md cursor-pointer transition-transform hover:scale-105 shadow-md ${cardStyle}`}
                  style={{left: node.x, top: node.y}}
                  onClick={() => setSelectedCourse(node.course)}>
                  <div className="flex justify-between items-center mb-1">
                    <span className="font-bold code-font text-xs text-white">{node.id}</span>
                    <span className="text-xs">{icon}</span>
                  </div>
                  <div className="text-xs text-[#E8EDF5] truncate font-semibold">{node.course.name}</div>
                  <div className="text-[10px] text-[#A0A0A0] mt-1 flex justify-between items-center">
                    <span className="truncate max-w-[115px]">{node.course.category}</span>
                    <span className="font-bold text-[#E2E8F0]">{node.course.credits} Cr</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

function Dashboard({ profile, setProfile, setCurrentView, savedPersonalProfile, onReturnToPersonal }) {
  const [selectedCourse, setSelectedCourse] = useState(null);
  const [showAnalytics, setShowAnalytics] = useState(false);
  const [alertsOpen, setAlertsOpen] = useState(false);
  const [whatIfOpen, setWhatIfOpen] = useState(false);
  const [graphOpen, setGraphOpen] = useState(false);
  
  const dept = (profile?.department || "ECE").toUpperCase();
  const deptMeta = window.getDepartmentMeta(dept);
  const deptCourses = window.getDepartmentCourses(dept);
  const deptTracks = window.getDepartmentCareerTracks(dept);
  const creditReqs = window.getDepartmentCreditRequirements(dept);

  const isDemoProfile = useMemo(() => {
    if (profile?.isDemo === true) return true;
    if (profile?.isDemo === false) return false;
    if (profile?.registerNumber && profile.registerNumber.includes("DEMO")) return true;
    if (window.DEMO_PROFILES_BY_DEPARTMENT && Object.values(window.DEMO_PROFILES_BY_DEPARTMENT).some(
      p => p.name === profile?.name && p.department === profile?.department
    )) return true;
    return false;
  }, [profile]);

  // Keyword Matcher State
  const [keywordQuery, setKeywordQuery] = useState("");
  const [keywordMatches, setKeywordMatches] = useState([]);

  useEffect(() => {
    if (keywordQuery.trim().length > 1 && window.matchCoursesToGoal) {
      setKeywordMatches(window.matchCoursesToGoal(keywordQuery, profile.completedCourses, profile.backlogs, dept).slice(0, 6));
    } else {
      setKeywordMatches([]);
    }
  }, [keywordQuery, profile, dept]);
  
  // What-If Simulation State
  const [plannedCourses, setPlannedCourses] = useState([]);
  const [simulationResult, setSimulationResult] = useState(null);

  // Dynamic Academic Calculations
  const creditData = useMemo(() => window.calculateCredits(profile.completedCourses, dept), [profile.completedCourses, dept]);
  
  const dynamicCGPA = useMemo(() => {
    const calc = window.calculateCGPA(profile.completedCourses, dept);
    return calc > 0 ? calc : (profile.cgpa || 0.0);
  }, [profile.completedCourses, profile.cgpa, dept]);

  const recommendations = useMemo(() => {
    return window.scoreAndRankCourses(profile, profile.completedCourses, profile.backlogs, profile.careerInterests, dept);
  }, [profile, dept]);

  const alerts = useMemo(() => {
    return window.generateAlerts(profile.completedCourses, profile.backlogs, profile.careerInterests, creditData, dept);
  }, [profile, creditData, dept]);

  // Exact 4-part Partition of Department Catalogue (Zero double-counting, sum = total catalogue)
  const pieData = useMemo(() => {
    const comp = profile.completedCourses || {};
    const bLogs = profile.backlogs || [];

    let completedCount = 0;
    let backlogCount = 0;
    let eligibleCount = 0;
    let lockedCount = 0;

    deptCourses.forEach(c => {
      const isPassed = comp[c.code] && comp[c.code].grade && comp[c.code].grade !== 'F' && comp[c.code].grade !== 'Not Attempted';
      const isBacklog = bLogs.includes(c.code) || comp[c.code]?.grade === 'F';

      if (isPassed) {
        completedCount++;
      } else if (isBacklog) {
        backlogCount++;
      } else {
        const check = window.checkPrerequisites(c.code, comp, bLogs, dept);
        if (check.eligible) {
          eligibleCount++;
        } else {
          lockedCount++;
        }
      }
    });

    return [
      { name: "Completed", value: completedCount, fill: "#05C493" },
      { name: "Backlog", value: backlogCount, fill: "#EF4444" },
      { name: "Eligible", value: eligibleCount, fill: "#5E56E3" },
      { name: "Locked", value: lockedCount, fill: "rgba(255,255,255,0.15)" }
    ];
  }, [profile, deptCourses, dept]);

  const barData = useMemo(() => {
    const comp = profile.completedCourses || {};
    return Object.entries(comp)
      .filter(([, d]) => d.grade && d.grade !== 'F' && d.grade !== 'Not Attempted')
      .map(([code, data]) => ({ course: code, points: window.GRADE_POINTS[data.grade] || 0 }));
  }, [profile.completedCourses]);

  const radarData = useMemo(() => {
    return Object.keys(deptTracks).map(track => ({
      track: track.split(" ")[0],
      readiness: window.calcTrackReadiness(track, profile.completedCourses, profile.backlogs, dept)
    }));
  }, [profile, deptTracks, dept]);

  const stackedBarData = useMemo(() => {
    const cats = creditReqs.byCategory || {};
    return Object.keys(cats).map(cat => ({
      category: cat.replace('Foundation ', '').replace(' Engineering', '').replace(' Elective', ''),
      Earned: creditData.earned[cat] || 0,
      Remaining: Math.max(0, (cats[cat] || 0) - (creditData.earned[cat] || 0))
    }));
  }, [creditData, creditReqs]);

  const toggleGrade = (code, grade) => {
    const next = { ...(profile.completedCourses || {}) };
    let nextBacklogs = [...(profile.backlogs || [])];

    if (next[code] && next[code].grade === grade) {
      delete next[code];
      nextBacklogs = nextBacklogs.filter(b => b !== code);
    } else {
      const course = deptCourses.find(c => c.code === code);
      next[code] = { grade, semester: profile.currentSemester || 1, credits: course?.credits || 4 };
      if (grade === 'F') {
        if (!nextBacklogs.includes(code)) nextBacklogs.push(code);
      } else {
        nextBacklogs = nextBacklogs.filter(b => b !== code);
      }
    }
    const updated = {...profile, completedCourses: next, backlogs: nextBacklogs};
    setProfile(updated);
    if (!isDemoProfile) {
      try {
        localStorage.setItem('icrgs_saved_personal_profile', JSON.stringify(updated));
        localStorage.setItem('icrgs_student_profile', JSON.stringify(updated));
        localStorage.setItem('icrgs_active_session_profile', JSON.stringify(updated));
      } catch(e) {}
    } else {
      try {
        localStorage.setItem('icrgs_active_session_profile', JSON.stringify(updated));
      } catch(e) {}
    }
  };

  const handleSimulate = () => {
    const result = window.simulateSemester(plannedCourses, profile);
    setSimulationResult(result);
  };

  const handleDepartmentChange = (newDept) => {
    if (newDept === dept) return;
    if (isDemoProfile) {
      const demo = window.getDepartmentDemoProfile(newDept);
      if (demo) {
        const demoWithFlag = { ...demo, isDemo: true };
        setProfile(demoWithFlag);
        setPlannedCourses([]);
        setSimulationResult(null);
        try {
          localStorage.setItem('icrgs_active_session_profile', JSON.stringify(demoWithFlag));
        } catch (e) {}
        return;
      }
    }
    const confirmed = window.confirm(`Switch active department to ${newDept}? This will load the ${newDept} course catalogue.`);
    if (confirmed) {
      const defaultTrack = Object.keys(window.getDepartmentCareerTracks(newDept))[0] || "";
      const updated = {
        ...profile,
        department: newDept,
        careerInterests: [defaultTrack],
        completedCourses: {},
        backlogs: [],
        isDemo: false
      };
      setProfile(updated);
      setPlannedCourses([]);
      setSimulationResult(null);
      try {
        localStorage.setItem('icrgs_saved_personal_profile', JSON.stringify(updated));
        localStorage.setItem('icrgs_student_profile', JSON.stringify(updated));
        localStorage.setItem('icrgs_active_session_profile', JSON.stringify(updated));
      } catch (e) {}
    }
  };

  const handleSelectDemoProfile = (deptKey) => {
    const demo = window.getDepartmentDemoProfile(deptKey);
    if (demo) {
      const demoWithFlag = { ...demo, isDemo: true };
      setProfile(demoWithFlag);
      setPlannedCourses([]);
      setSimulationResult(null);
      try {
        localStorage.setItem('icrgs_active_session_profile', JSON.stringify(demoWithFlag));
      } catch (e) {}
    }
  };

  const exportToPDF = () => {
    const element = document.getElementById('dashboard-content');
    const opt = {
      margin: 0.4,
      filename: `Academic_Portfolio_${profile.registerNumber || dept}_${dept}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, logging: false },
      jsPDF: { unit: 'in', format: 'a3', orientation: 'landscape' }
    };
    if (window.html2pdf) {
      window.html2pdf().set(opt).from(element).save();
    } else {
      alert("PDF exporter is loading. Please try again in a moment.");
    }
  };

  // Group Courses by Category
  const categoriesList = useMemo(() => {
    const set = new Set();
    deptCourses.forEach(c => set.add(c.category));
    return Array.from(set);
  }, [deptCourses]);

  return (
    <div id="dashboard-content" className="max-w-[1440px] mx-auto pt-6 px-4 sm:px-6 pb-24 bg-[var(--bg-primary)]">
      
      {/* Top Bar Navigation */}
      <div className="flex flex-wrap items-center justify-between gap-3 mb-6 bg-[rgba(255,255,255,0.02)] p-2.5 sm:p-3 rounded-2xl border border-[rgba(255,255,255,0.07)]">
        <Button 
          variant="outline" 
          onClick={() => {
            if (setCurrentView) setCurrentView('landing');
            else window.location.reload();
          }} 
          className="text-xs py-1.5 px-3.5 border-[rgba(255,255,255,0.25)] text-white hover:bg-[rgba(255,255,255,0.1)] flex items-center gap-2 rounded-xl transition-all shadow-sm font-semibold"
          title="Return to Home / Landing Page"
        >
          <span className="text-base leading-none">←</span>
          <span>Back to Home</span>
        </Button>

        <div className="flex items-center gap-2 flex-wrap">
          {!isDemoProfile ? (
            <div className="flex items-center gap-2">
              <span className="text-xs text-[#05C493] bg-[rgba(5,196,147,0.1)] border border-[rgba(5,196,147,0.25)] px-3 py-1 rounded-full font-semibold flex items-center gap-1.5">
                <span>👤</span> Personal Student Profile: <strong className="text-white">{profile.name || 'Student'}</strong>
              </span>
              <Button 
                variant="outline" 
                onClick={() => {
                  if (setCurrentView) setCurrentView('onboarding');
                }} 
                className="text-xs py-1 px-3 border-[rgba(255,255,255,0.2)] text-[#A0A0A0] hover:text-white hover:bg-[rgba(255,255,255,0.1)] rounded-xl flex items-center gap-1"
                title="Edit profile settings, courses, or career track"
              >
                ✏️ Edit Profile
              </Button>
            </div>
          ) : (
            <div className="flex items-center gap-2 flex-wrap">
              <span className="text-xs text-[#EAB308] bg-[rgba(234,179,8,0.1)] border border-[rgba(234,179,8,0.25)] px-3 py-1 rounded-full font-semibold flex items-center gap-1.5">
                <span>⚡</span> Fictional Demo Mode: <strong className="text-white">{profile.name}</strong> ({dept})
              </span>
              {savedPersonalProfile && (
                <Button 
                  variant="success" 
                  onClick={onReturnToPersonal} 
                  className="text-xs py-1 px-3 bg-[#05C493] hover:bg-[#04AC81] text-black font-bold flex items-center gap-1.5 rounded-xl shadow-sm cursor-pointer"
                  title="Return to your saved personal student profile"
                >
                  <span>👤</span> <span>Return to My Profile ({savedPersonalProfile.name})</span>
                </Button>
              )}
            </div>
          )}
        </div>
      </div>

      {/* Header */}
      <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-8 border-b border-[rgba(255,255,255,0.08)] pb-6 gap-4">
        <div>
          <div className="flex flex-wrap items-center gap-2 mb-2">
            <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[rgba(94,86,227,0.12)] border border-[rgba(94,86,227,0.25)] text-[#7E78EE] text-xs font-bold uppercase tracking-wider">
              <span>{deptMeta.icon}</span> Selected Department: {profile.department} ({deptMeta.name})
            </span>
            <span className="text-[11px] text-[#05C493] bg-[rgba(5,196,147,0.1)] border border-[rgba(5,196,147,0.25)] px-2.5 py-0.5 rounded-full font-semibold">
              {deptMeta.statusNote}
            </span>
          </div>

          <h1 className="text-2xl md:text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-[#7E78EE] to-[#05C493]">
            Intelligent Course Recommendation and Guidance System
          </h1>

          <div className="text-[#94A3B8] mt-2 font-medium flex flex-wrap items-center gap-x-3 gap-y-1.5 text-xs sm:text-sm">
            <span>👤 <strong className="text-white">{profile.name || 'Demo Student'}</strong> ({profile.registerNumber || `${dept}-DEMO`})</span>
            <span>•</span>
            <span>CGPA: <strong className="text-[#05C493]">{dynamicCGPA}</strong></span>
            <span>•</span>
            <span>Curriculum Progress: <strong className="text-white">{creditData.totalEarned} / {creditData.catalogueCredits} Total Credits</strong> ({creditData.cataloguePercentage}%)</span>
            <span className="text-[11px] text-[#05C493] bg-[rgba(5,196,147,0.1)] px-2.5 py-0.5 rounded-full border border-[rgba(5,196,147,0.25)] font-semibold">🎯 Target: {creditData.catalogueCredits} Credits</span>
          </div>
        </div>

        {/* Header Actions */}
        <div className="flex flex-wrap items-center gap-2">
          {/* Quick Department & Demo Student Switchers (ONLY VISIBLE IN DEMO PROFILES) */}
          {isDemoProfile ? (
            <>
              {/* Quick Department Switcher */}
              <div className="flex items-center gap-1.5 bg-[rgba(0,0,0,0.4)] border border-[rgba(255,255,255,0.08)] rounded-xl px-2.5 py-1" title="Switch Demo Department">
                <span className="text-xs text-[#94A3B8] font-bold">Dept:</span>
                <select value={profile.department || "ECE"} onChange={e => handleDepartmentChange(e.target.value)}
                  className="bg-transparent text-xs font-bold text-[#7E78EE] outline-none cursor-pointer">
                  {Object.keys(window.DEPARTMENTS || {}).map(d => (
                    <option key={d} value={d} className="bg-[#12121A] text-white">{d}</option>
                  ))}
                </select>
              </div>

              {/* Quick Demo Student Switcher */}
              <div className="flex items-center gap-1.5 bg-[rgba(0,0,0,0.4)] border border-[rgba(255,255,255,0.08)] rounded-xl px-2.5 py-1" title="Select and load pre-configured demo student profile">
                <span className="text-xs text-[#94A3B8] font-bold">Demo Student:</span>
                <select 
                  value={profile.department || "ECE"} 
                  onChange={e => handleSelectDemoProfile(e.target.value)}
                  className="bg-transparent text-xs font-bold text-[#05C493] outline-none cursor-pointer"
                >
                  {Object.entries(window.DEMO_PROFILES_BY_DEPARTMENT || {}).map(([dKey, p]) => (
                    <option key={dKey} value={dKey} className="bg-[#12121A] text-white">
                      {p.name} ({dKey} · {p.cgpa} CGPA)
                    </option>
                  ))}
                </select>
              </div>

              {savedPersonalProfile && (
                <Button variant="outline" onClick={onReturnToPersonal} className="text-xs py-2 px-3 border-[#05C493] text-[#05C493] hover:bg-[rgba(5,196,147,0.1)] flex items-center gap-1 font-bold" title="Return to your saved personal profile">
                  👤 My Profile
                </Button>
              )}
            </>
          ) : (
            /* Personal Profile: Show static Department Badge */
            <div className="flex items-center gap-1.5 bg-[rgba(94,86,227,0.15)] border border-[rgba(94,86,227,0.3)] rounded-xl px-3 py-1.5 text-xs font-bold text-white shadow-sm">
              <span>{deptMeta.icon}</span>
              <span>{deptMeta.name}</span>
              <span className="text-[#7E78EE] font-black">({dept})</span>
            </div>
          )}

          <Button variant="outline" onClick={() => {
            if (window.confirm("🚨 Reset profile and return to start? This will clear locally saved settings and your personal profile.")) {
              try {
                localStorage.removeItem('icrgs_saved_personal_profile');
                localStorage.removeItem('icrgs_student_profile');
                localStorage.removeItem('icrgs_active_session_profile');
              } catch(e) {}
              setProfile({ name: "", registerNumber: "", department: "ECE", schoolBackground: "", currentSemester: 1, cgpa: 0, careerInterests: [], preferredIndustry: "", preferredHigherStudies: "", completedCourses: {}, backlogs: [], semesterCGPA: {}, isDemo: false });
              setCurrentView('landing');
            }
          }} className="border-[#EF4444] text-[#EF4444] hover:bg-[rgba(239,68,68,0.1)] text-xs py-2 px-3" title="Reset All Progress">
            🗑️ Reset
          </Button>

          <Button variant="outline" onClick={exportToPDF} className="text-xs py-2 px-3" title="Download PDF Portfolio">📥 PDF</Button>
          <Button variant="outline" onClick={() => {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            if (isLight) document.documentElement.removeAttribute('data-theme');
            else document.documentElement.setAttribute('data-theme', 'light');
          }} className="text-xs py-2 px-3" title="Toggle Light/Dark Theme">🌓 Theme</Button>
          
          <Button variant="outline" onClick={() => setGraphOpen(true)} className="text-xs py-2 px-3" title="View Prerequisite Graph">🕸️ Graph</Button>
          <Button variant="outline" onClick={() => setWhatIfOpen(true)} className="text-xs py-2 px-3">🔮 Simulator</Button>
          
          <div className="relative cursor-pointer p-2 rounded-xl bg-[rgba(255,255,255,0.05)] border border-[rgba(255,255,255,0.1)] hover:bg-[rgba(255,255,255,0.1)] transition-colors" onClick={() => setAlertsOpen(true)} title="Smart Alerts">
            <span className="text-base">🔔</span>
            {alerts.length > 0 && <div className="absolute -top-1.5 -right-1.5 bg-[#EF4444] text-white text-[10px] rounded-full w-5 h-5 flex items-center justify-center font-bold shadow-sm">{alerts.length}</div>}
          </div>

          <div className="w-8 h-8 rounded-full bg-[#5E56E3] flex items-center justify-center font-bold shadow-sm cursor-pointer text-xs" onClick={() => setCurrentView('onboarding')} title="Edit Profile Details">
            {profile.name ? profile.name.charAt(0).toUpperCase() : '?'}
          </div>
        </div>
      </div>

      {/* Main Content Layout */}
      <div className="grid grid-cols-1 xl:grid-cols-12 gap-8">
        
        {/* Left Column: Academic Course History Checklist */}
        <div className="xl:col-span-4 space-y-6">
          <div className="glass-card max-h-[85vh] overflow-y-auto custom-scrollbar">
            <h2 className="text-xl font-bold mb-3 sticky top-0 bg-[var(--bg-card)] backdrop-blur-md py-3 border-b border-[rgba(255,255,255,0.1)] z-10 flex items-center gap-2">
              <span className="text-2xl">📚</span> Course History ({dept})
            </h2>
            
            <div className="mb-4 p-3 bg-[rgba(94,86,227,0.08)] border border-[rgba(94,86,227,0.2)] rounded-xl text-xs text-[#94A3B8] leading-relaxed">
              📌 <strong>Curriculum Structure:</strong> {deptMeta.courseCount} courses totaling {deptMeta.catalogueCredits} credits for {dept}.
            </div>

            {categoriesList.map(categoryName => {
              const coursesInCat = deptCourses.filter(c => c.category === categoryName);
              if (coursesInCat.length === 0) return null;

              return (
                <div key={categoryName} className="mb-7">
                  <h3 className="text-xs font-bold text-[#94A3B8] uppercase tracking-widest mb-3 border-b border-[rgba(255,255,255,0.05)] pb-1.5 flex items-center gap-2">
                    {categoryName.includes('Foundation') ? '🏗️' : categoryName.includes('Elective') ? '🎯' : '⚙️'} {categoryName}
                  </h3>

                  {coursesInCat.map(c => {
                    const compData = profile.completedCourses?.[c.code];
                    const isPassed = compData && compData.grade && compData.grade !== 'F' && compData.grade !== 'Not Attempted';
                    const isBacklog = (profile.backlogs || []).includes(c.code) || compData?.grade === 'F';
                    const prereqCheck = window.checkPrerequisites(c.code, profile.completedCourses, profile.backlogs, dept);

                    return (
                      <div key={c.code} className={`mb-3 p-3.5 border rounded-xl transition-colors ${isPassed ? 'bg-[rgba(5,196,147,0.03)] border-[rgba(5,196,147,0.25)]' : isBacklog ? 'bg-[rgba(239,68,68,0.04)] border-[rgba(239,68,68,0.25)]' : 'bg-[rgba(0,0,0,0.25)] border-[rgba(255,255,255,0.05)]'}`}>
                        <div className="flex justify-between items-start mb-2.5">
                          <div className="cursor-pointer group flex-1" onClick={() => setSelectedCourse(c)}>
                            <div className="text-sm font-bold code-font text-[#7E78EE] group-hover:underline flex items-center gap-2">
                              {c.code}
                              <span className="text-[#94A3B8] text-[10px] font-normal bg-[rgba(255,255,255,0.05)] px-1.5 py-0.5 rounded tracking-wider">{c.credits} Credits · {c.category}</span>
                            </div>
                            <div className="text-xs text-[#E2E8F0] mt-1 leading-snug">{c.name}</div>
                          </div>
                        </div>

                        {/* Grade Toggles */}
                        <div className="flex gap-1 mb-2 bg-[rgba(0,0,0,0.3)] p-1 rounded-lg">
                          {['O', 'A+', 'A', 'B+', 'B', 'C', 'F'].map(g => {
                            const isSelected = compData?.grade === g;
                            return (
                              <button key={g} onClick={() => toggleGrade(c.code, g)} 
                                className={`flex-1 py-1 rounded text-[10px] font-bold transition-all ${isSelected ? (g === 'F' ? 'bg-[#EF4444] text-white shadow-sm' : 'bg-[#05C493] text-white font-bold shadow-sm') : 'text-[#94A3B8] hover:bg-[rgba(255,255,255,0.08)]'}`}>
                                {g}
                              </button>
                            );
                          })}
                        </div>

                        {/* Prerequisite Tags & Eligibility */}
                        {c.prerequisites && c.prerequisites.length > 0 && (
                          <div className="text-[10px] text-[#94A3B8] mt-2 border-t border-[rgba(255,255,255,0.05)] pt-2 space-y-1">
                            <div className="flex flex-wrap gap-1 items-center">
                              <span className="text-white font-medium">Prereqs:</span>
                              {c.prerequisites.map(p => {
                                const pPassed = profile.completedCourses?.[p] && profile.completedCourses[p].grade !== 'F' && profile.completedCourses[p].grade !== 'Not Attempted';
                                return <span key={p} className="code-font bg-[rgba(255,255,255,0.05)] px-1 rounded">{p} {pPassed ? '✅' : '❌'}</span>;
                              })}
                            </div>
                            {!prereqCheck.eligible ? (
                              <div className="text-[#EF4444] font-bold bg-[rgba(239,68,68,0.1)] inline-block px-1.5 py-0.5 rounded mt-0.5">Status: 🔒 Locked</div>
                            ) : (
                              <div className="text-[#05C493] font-bold bg-[rgba(5,196,147,0.1)] inline-block px-1.5 py-0.5 rounded mt-0.5">Status: ✅ Eligible</div>
                            )}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
        </div>

        {/* Center & Right Column: Analytics, Roadmap, Recommendations */}
        <div className="xl:col-span-8 space-y-8">
          
          {/* Top Metrics Row */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
            <div className="glass-card flex items-center gap-4">
              <div className="relative w-16 h-16 flex-shrink-0">
                <svg viewBox="0 0 36 36" className="w-full h-full drop-shadow-sm">
                  <path strokeDasharray="100, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth="4"/>
                  <path strokeDasharray={`${Math.min(100, creditData.cataloguePercentage)}, 100`} d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="#5E56E3" strokeWidth="4" style={{transition: 'stroke-dasharray 1s ease'}}/>
                </svg>
                <div className="absolute inset-0 flex items-center justify-center text-xs font-bold text-white">{creditData.cataloguePercentage}%</div>
              </div>
              <div>
                <div className="text-xs text-[#94A3B8] font-bold uppercase tracking-wider">Curriculum Credit Progress</div>
                <div className="text-xl font-bold text-white">{creditData.totalEarned} / {creditData.catalogueCredits} <span className="text-xs font-normal text-[#05C493]">Total Credits</span></div>
                <div className="text-[11px] text-[#94A3B8] mt-0.5">{Math.max(0, creditData.catalogueCredits - creditData.totalEarned)} credits remaining across {Math.max(0, deptCourses.length - Object.keys(profile.completedCourses || {}).length)} courses</div>
              </div>
            </div>

            <div className="glass-card flex flex-col justify-center">
              <div className="text-xs text-[#94A3B8] font-bold uppercase tracking-wider mb-1">Active Backlogs</div>
              <div className="text-3xl font-bold text-[#EF4444]">{(profile.backlogs || []).length}</div>
              <div className="text-xs text-[#94A3B8] mt-1">
                {(profile.backlogs || []).length === 0 ? "No active backlogs blocking courses" : `Affecting subsequent courses in ${dept}`}
              </div>
            </div>

            <div className="glass-card flex flex-col justify-center">
              <div className="text-xs text-[#94A3B8] font-bold uppercase tracking-wider mb-1">Career Pathway Course Progress</div>
              <div className="text-3xl font-bold text-[#EAB308]">
                {profile.careerInterests?.[0] ? window.calcTrackReadiness(profile.careerInterests[0], profile.completedCourses, profile.backlogs, dept) : 0}%
              </div>
              <div className="text-xs text-[#94A3B8] mt-1 truncate" title="Percentage of recommended coursework completed along selected pathway">
                Track: {profile.careerInterests?.[0] || 'Select Pathway'}
              </div>
            </div>
          </div>

          {/* Goal & Elective Matcher */}
          <div className="glass-card">
            <div className="flex justify-between items-start mb-2">
              <div>
                <h2 className="text-xl font-bold flex items-center gap-2 text-white"><span className="text-2xl">🎯</span> Elective & Career Matcher ({dept})</h2>
                <p className="text-[#94A3B8] text-xs mt-1">Rule & keyword search across {dept} career tracks, course descriptions, and learned skillsets (runs 100% locally in browser without external AI API).</p>
              </div>
            </div>
            <div className="relative my-4">
              <input type="text" placeholder={`Search ${dept} courses (e.g., AI, cloud, robotics, circuits, design, algorithms...)`}

                value={keywordQuery} onChange={e => setKeywordQuery(e.target.value)} />
              <div className="absolute right-4 top-3.5 text-lg pointer-events-none opacity-50">🔍</div>
            </div>
            
            {keywordQuery.trim().length >= 2 && keywordMatches.length === 0 && (
              <div className="p-4 rounded-xl bg-[rgba(255,255,255,0.02)] border border-[rgba(255,255,255,0.08)] text-center text-sm text-[#94A3B8]">
                <p className="font-semibold text-white mb-1">No matching courses found for "{keywordQuery}" in {dept}</p>
                <p className="text-xs">Try searching for broader domain terms or check other engineering departments.</p>
              </div>
            )}

            {keywordMatches.length > 0 && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5 animate-[fadeIn_0.4s_ease]">
                {keywordMatches.map((match, idx) => (
                  <div key={idx} className="border border-[rgba(255,255,255,0.1)] rounded-xl p-3.5 bg-[rgba(0,0,0,0.2)] hover:bg-[rgba(255,255,255,0.02)] transition-colors cursor-pointer" onClick={() => setSelectedCourse(match.course)}>
                    <div className="flex justify-between items-start mb-1.5">
                      <div>
                        <h3 className="font-bold text-sm text-white hover:text-[#7E78EE] transition-colors"><span className="code-font text-[#7E78EE]">{match.course.code}</span> · {match.course.name}</h3>

// ── Storage Keys Configuration ────────────────────────────────
const PERSONAL_PROFILE_KEY = 'icrgs_saved_personal_profile';
const ACTIVE_PROFILE_KEY = 'icrgs_active_session_profile';
const LEGACY_PROFILE_KEY = 'icrgs_student_profile';

const getStoredPersonalProfile = () => {
  try {
    const raw = localStorage.getItem(PERSONAL_PROFILE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && p.name && !p.isDemo && !(p.registerNumber && p.registerNumber.includes("DEMO"))) {
        return p;
      }
    }
    const legacy = localStorage.getItem(LEGACY_PROFILE_KEY);
    if (legacy) {
      const p = JSON.parse(legacy);
      const isDemo = Boolean(p.isDemo || (p.registerNumber && p.registerNumber.includes("DEMO")) ||
        (window.DEMO_PROFILES_BY_DEPARTMENT && Object.values(window.DEMO_PROFILES_BY_DEPARTMENT).some(dp => dp.name === p.name && dp.department === p.department)));
      if (!isDemo && p.name && p.department) {
        return p;
      }
    }
  } catch (e) {
    console.warn("Storage read error:", e);
  }
  return null;
};

// ── Main App Root ──────────────────────────────────────────────
function App() {
  const [profile, setProfile] = useState(() => {
    try {
      const activeRaw = localStorage.getItem(ACTIVE_PROFILE_KEY);
      if (activeRaw) {
        const parsed = JSON.parse(activeRaw);
        if (parsed && parsed.department) {
          const isDemoCalculated = parsed.isDemo !== undefined ? Boolean(parsed.isDemo) : Boolean(
            (parsed.registerNumber && parsed.registerNumber.includes("DEMO")) ||
            (window.DEMO_PROFILES_BY_DEPARTMENT && Object.values(window.DEMO_PROFILES_BY_DEPARTMENT).some(p => p.name === parsed.name && p.department === parsed.department))
          );
          return {
            name: parsed.name || "",
            registerNumber: parsed.registerNumber || "",
            department: parsed.department || "ECE",
            schoolBackground: parsed.schoolBackground || "",
            currentSemester: parsed.currentSemester || 1,
            cgpa: parsed.cgpa !== undefined ? parsed.cgpa : 0,
            careerInterests: parsed.careerInterests || [],
            preferredIndustry: parsed.preferredIndustry || "",
            preferredHigherStudies: parsed.preferredHigherStudies || "",
            completedCourses: parsed.completedCourses || {},
            backlogs: parsed.backlogs || [],
            semesterCGPA: parsed.semesterCGPA || {},
            isDemo: isDemoCalculated
          };
        }
      }
      
      const personal = getStoredPersonalProfile();
      if (personal) {
        return { ...personal, isDemo: false };
      }
    } catch (e) {
      console.warn("Local storage retrieval error:", e);
    }
    return {
      name: "", registerNumber: "", department: "ECE", schoolBackground: "", currentSemester: 1, cgpa: 0,
      careerInterests: [], preferredIndustry: "", preferredHigherStudies: "",
      completedCourses: {}, backlogs: [], semesterCGPA: {},
      isDemo: false
    };
  });

  const [currentView, setCurrentView] = useState('landing');

  // Push state & popstate support for browser Back/Forward navigation
  const navigateTo = (view) => {
    if (view === currentView) return;
    try {
      window.history.pushState({ view }, '');
    } catch(e) {}
    setCurrentView(view);
  };

  useEffect(() => {
    try {
      if (!window.history.state || !window.history.state.view) {
        window.history.replaceState({ view: 'landing' }, '');
      }
    } catch(e) {}

    const handlePopState = (event) => {
      const targetView = event.state?.view || 'landing';
      setCurrentView(targetView);
    };

    window.addEventListener('popstate', handlePopState);
    return () => window.removeEventListener('popstate', handlePopState);
  }, []);

  const savedPersonalProfile = useMemo(() => {
    return getStoredPersonalProfile();
  }, [profile, currentView]);

  const hasSavedProfile = Boolean(savedPersonalProfile);

  const savedProfileMeta = useMemo(() => {
    if (savedPersonalProfile) {
      return { 
        name: savedPersonalProfile.name, 
        dept: savedPersonalProfile.department
      };
    }
    return null;
  }, [savedPersonalProfile]);

  useEffect(() => {
    if (currentView === 'dashboard') {
      try {
        localStorage.setItem(ACTIVE_PROFILE_KEY, JSON.stringify(profile));
        // ONLY update personal profile storage if this profile is NOT a demo!
        if (!profile.isDemo && !(profile.registerNumber && profile.registerNumber.includes("DEMO")) && profile.name) {
          localStorage.setItem(PERSONAL_PROFILE_KEY, JSON.stringify(profile));
          localStorage.setItem(LEGACY_PROFILE_KEY, JSON.stringify(profile));
        }
      } catch (e) {
        console.warn("Could not persist to localStorage:", e);
      }
    }
  }, [profile, currentView]);

  const handleContinueSaved = () => {
    const saved = getStoredPersonalProfile();
    if (saved) {
      setProfile({ ...saved, isDemo: false });
      try {
        localStorage.setItem(ACTIVE_PROFILE_KEY, JSON.stringify({ ...saved, isDemo: false }));
      } catch (e) {}
    }
    navigateTo('dashboard');
  };

  const handleReturnToPersonal = () => {
    const saved = getStoredPersonalProfile();
    if (saved) {
      setProfile({ ...saved, isDemo: false });
      try {
        localStorage.setItem(ACTIVE_PROFILE_KEY, JSON.stringify({ ...saved, isDemo: false }));
      } catch (e) {}
    }
    navigateTo('dashboard');
  };

  const handleCreateNew = () => {
    setProfile({
      name: "", registerNumber: "", department: "ECE", schoolBackground: "", currentSemester: 1, cgpa: 0,
      careerInterests: [], preferredIndustry: "", preferredHigherStudies: "",
      completedCourses: {}, backlogs: [], semesterCGPA: {},
      isDemo: false
    });
    navigateTo('onboarding');
  };

  const handleLoadDemo = (deptKey = "ECE") => {
    const demo = (window.getDepartmentDemoProfile && window.getDepartmentDemoProfile(deptKey)) || SAMPLE_DEMO_PROFILE;
    const demoWithFlag = { ...demo, isDemo: true };
    setProfile(demoWithFlag);
    try {
      localStorage.setItem(ACTIVE_PROFILE_KEY, JSON.stringify(demoWithFlag));
    } catch (e) {
      console.warn("Could not save demo profile to localStorage", e);
    }
    navigateTo('dashboard');
  };

  if (currentView === 'landing') {
    return (
      <LandingPage 
        onContinueSaved={handleContinueSaved} 
        onCreateNew={handleCreateNew} 
        onLoadDemo={handleLoadDemo} 
        hasSavedProfile={hasSavedProfile}
        savedProfileMeta={savedProfileMeta}
      />
    );
  }

  if (currentView === 'onboarding') {
    return (
      <Onboarding 
        profile={profile} 
        setProfile={setProfile} 
        onComplete={() => {
          const personalProfile = { ...profile, isDemo: false };
          setProfile(personalProfile);
          try {
            localStorage.setItem(PERSONAL_PROFILE_KEY, JSON.stringify(personalProfile));
            localStorage.setItem(LEGACY_PROFILE_KEY, JSON.stringify(personalProfile));
            localStorage.setItem(ACTIVE_PROFILE_KEY, JSON.stringify(personalProfile));
          } catch(e) {}
          navigateTo('dashboard');
        }} 
        onLoadDemo={handleLoadDemo} 
        onBackToLanding={() => navigateTo('landing')}
      />
    );
  }

  return (
    <Dashboard 
      profile={profile} 
      setProfile={setProfile} 
      setCurrentView={navigateTo} 
      savedPersonalProfile={savedPersonalProfile}
      onReturnToPersonal={handleReturnToPersonal}
    />
  );
}

// ── Error Boundary Component (Prevents Black Screen) ───────────
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, errorInfo) {
    console.error("ErrorBoundary caught error:", error, errorInfo);
  }
  handleReset() {
    try {
      localStorage.removeItem('icrgs_saved_personal_profile');
      localStorage.removeItem('icrgs_student_profile');
      localStorage.removeItem('icrgs_active_session_profile');
    } catch(e) {}
    window.location.reload();
  }
  render() {
    if (this.state.hasError) {
      return (
        <div className="min-h-screen flex items-center justify-center p-6 bg-[#0B0E14] text-white">
          <div className="max-w-md w-full p-6 rounded-2xl bg-[rgba(255,255,255,0.05)] border border-[rgba(255,255,255,0.1)] text-center shadow-2xl">
            <div className="text-4xl mb-4">⚠️</div>
            <h2 className="text-xl font-bold mb-2">Display Notice</h2>
            <p className="text-sm text-[#94A3B8] mb-6">
              A temporary display error occurred. You can reset to the verified demo profile or reload the page.
            </p>
            <div className="flex gap-3 justify-center">
              <button onClick={() => this.handleReset()} className="px-5 py-2.5 rounded-xl bg-[#5E56E3] hover:bg-[#4F46E5] text-white text-sm font-bold shadow-md transition-transform hover:scale-105">
                Reset Demo State & Reload
              </button>
              <button onClick={() => window.location.reload()} className="px-5 py-2.5 rounded-xl border border-[rgba(255,255,255,0.2)] text-white text-sm hover:bg-[rgba(255,255,255,0.05)]">
                Reload
              </button>
            </div>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  <ErrorBoundary>
    <App />
  </ErrorBoundary>
);
    </script>
</body>
</html>
